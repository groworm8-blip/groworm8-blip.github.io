<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groworm Solutions</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#020617;color:#fff;overflow-x:hidden}
#particles{position:fixed;inset:0;z-index:-1}
.container{max-width:1400px;margin:auto;padding:0 24px}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:space-between;gap:80px}
.brand{display:flex;align-items:center;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.logo{width:130px;height:auto;object-fit:contain}
.brand-text h2{font-size:42px;color:#fff}
.brand-text p{color:#38bdf8;margin-top:4px}
.hero h1{font-size:72px;line-height:1}
.hero h1 span{color:#f97316}
.hero p{font-size:24px;color:#cbd5e1;margin:25px 0;max-width:700px}
.contact{font-size:22px;color:#38bdf8;font-weight:bold;margin-bottom:25px}
.btn{display:inline-block;padding:16px 30px;background:linear-gradient(90deg,#0ea5e9,#f97316);border-radius:14px;color:white;text-decoration:none;font-weight:bold}
.photo{width:460px;max-width:100%;border-radius:30px;box-shadow:0 0 50px rgba(14,165,233,.4)}
@media(max-width:900px){
.hero{flex-direction:column;padding-top:40px;text-align:center}
.hero h1{font-size:52px}
.brand{justify-content:center}
.brand-text h2{font-size:32px}
.contact{font-size:18px}
}
</style>
</head>
<body>
<canvas id="particles"></canvas>

<div class="container">
<section class="hero">
<div>

<div class="brand">
<img src="images/logo.png" class="logo">
<div class="brand-text">
<h2>Groworm Solutions</h2>
<p>Aplicativos • Sistemas • Inovação</p>
</div>
</div>

<h1>Darlan André <br><span>Ferreira</span></h1>

<p>Transformando ideias em aplicativos reais. Soluções mobile, sistemas comerciais, produtividade, esportes, inteligência artificial e entretenimento.</p>

<div class="contact">📱 WhatsApp: (42) 98882-5736</div>

<a href="#apps" class="btn">Conheça meus projetos</a>

</div>

<div>
<img src="images/darlan.png" class="photo">
</div>
</section>
</div>
</body>
</html>
